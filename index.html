<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Staff Alert, P.S. I Crepe You</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* One scale value drives every size. Phones stay at 1, tablets grow. */
      --s: 1;
      --pink: #ff1a6e;
      --pink-dark: #b5004a;   /* text pink with strong contrast on light backgrounds */
      --ink: #3d0020;
      --card: #fff0f5;
      --line: #ffb3d0;
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ff4d8d;
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
    }

    .skip-link {
      position: absolute; left: 8px; top: -60px; background: #fff; color: var(--ink);
      padding: 10px 16px; border-radius: 8px; font-weight: 700; z-index: 10;
    }
    .skip-link:focus { top: 8px; }

    .rc-header {
      background: linear-gradient(135deg, #ff1a6e 0%, #ff5fa0 50%, #ff1a6e 100%);
      padding: calc(28px * var(--s)) 24px calc(22px * var(--s));
      text-align: center;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .rc-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.05) 20px, rgba(255,255,255,0.05) 40px);
    }
    .rc-header-eyebrow { font-size: calc(11px * var(--s)); letter-spacing: 5px; color: #fff; text-transform: uppercase; margin-bottom: 8px; position: relative; }
    .rc-header-title { font-family: 'Playfair Display', serif; font-size: calc(30px * var(--s)); color: #fff; font-weight: 700; position: relative; }
    .rc-header-sub { font-size: calc(12px * var(--s)); color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; position: relative; }

    main.rc-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(22px * var(--s)) 16px calc(28px * var(--s));
    }

    .rc-card {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: calc(18px * var(--s));
      padding: calc(26px * var(--s)) calc(24px * var(--s));
      box-shadow: 0 8px 40px rgba(255,20,100,0.2);
    }

    fieldset { border: none; }

    .rc-section-title {
      display: block; width: 100%;
      font-size: calc(11px * var(--s)); font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: var(--pink-dark); margin: calc(22px * var(--s)) 0 calc(12px * var(--s));
      padding-bottom: 8px; border-bottom: 1px solid #ffcce0;
    }
    .rc-section-title.first { margin-top: 0; }

    .rc-label {
      display: block; font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--pink-dark);
      margin-bottom: calc(8px * var(--s)); margin-top: calc(14px * var(--s));
    }
    .rc-label .opt { font-weight: 500; letter-spacing: 1px; text-transform: none; }

    .rc-input {
      width: 100%; background: #fff; border: 2px solid #e88ab0; border-radius: calc(10px * var(--s));
      padding: calc(14px * var(--s)) calc(16px * var(--s));
      font-size: calc(17px * var(--s)); font-family: 'DM Sans', sans-serif; color: var(--ink);
      transition: border-color 0.2s; -webkit-appearance: none; appearance: none;
    }
    .rc-input::placeholder { color: #9a5470; }
    textarea.rc-input { resize: none; min-height: calc(90px * var(--s)); }

    /* Visible keyboard focus everywhere */
    .rc-input:focus-visible,
    .choice:focus-visible,
    .rc-submit-btn:focus-visible,
    .rc-reset-btn:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }
    .rc-input:focus { border-color: var(--pink); }

    /* Choice buttons (location and alert type) */
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(10px * var(--s)); }
    .choice-grid.three { grid-template-columns: 1fr 1fr 1fr; }

    .choice {
      background: #fff;
      border: 2px solid #e88ab0;
      border-radius: calc(12px * var(--s));
      padding: calc(16px * var(--s)) 10px;
      min-height: 44px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
      color: var(--pink-dark);
      width: 100%;
    }
    .choice:hover { border-color: var(--pink); background: #fff5f8; }
    .choice[aria-pressed="true"] {
      border-color: var(--pink-dark);
      background: #ffd6e7;
      box-shadow: inset 0 0 0 2px var(--pink-dark);
    }
    .choice .icon { display: block; font-size: calc(26px * var(--s)); margin-bottom: calc(6px * var(--s)); }
    .choice .text { display: block; font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.3; }
    .choice[aria-pressed="true"] .text::after { content: " \2713"; }

    .rc-submit-btn {
      width: 100%; background: linear-gradient(135deg, #e0005a, #b5004a); color: #fff;
      border: none; border-radius: calc(12px * var(--s));
      padding: calc(18px * var(--s)) 0; font-size: calc(16px * var(--s)); font-weight: 700;
      font-family: 'DM Sans', sans-serif; cursor: pointer; letter-spacing: 2px;
      text-transform: uppercase; margin-top: auto; transition: opacity 0.2s, transform 0.1s;
    }
    .submit-wrap { margin-top: calc(22px * var(--s)); flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; }
    .rc-submit-btn[aria-disabled="true"] { background: #ffcce0; color: #8a2a52; cursor: not-allowed; }
    .rc-submit-btn:not([aria-disabled="true"]):active { transform: scale(0.99); }

    .form-hint { margin-top: 10px; font-size: calc(14px * var(--s)); color: #8a0038; text-align: center; min-height: 1.2em; }

    /* Success */
    .rc-success-icon { font-size: calc(52px * var(--s)); text-align: center; margin-bottom: 14px; }
    .rc-success-title { font-family: 'Playfair Display', serif; font-size: calc(28px * var(--s)); color: var(--ink); font-weight: 700; text-align: center; margin-bottom: 6px; }
    .rc-success-sub { text-align: center; color: var(--pink-dark); font-size: calc(15px * var(--s)); margin-bottom: 28px; line-height: 1.6; }

    .rc-alert-badge { border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; border: 1px solid transparent; text-align: center; }
    .rc-alert-badge .badge-icon { font-size: calc(32px * var(--s)); margin-bottom: 8px; }
    .rc-alert-badge .badge-type { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .rc-alert-badge .badge-item { font-family: 'Playfair Display', serif; font-size: calc(22px * var(--s)); font-weight: 700; }

    .rc-summary { background: #ffe0ee; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .rc-summary-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid #ffcce0; font-size: calc(15px * var(--s)); }
    .rc-summary-row:last-child { border-bottom: none; }
    .rc-summary-key { color: #8a0038; }
    .rc-summary-val { color: var(--ink); font-weight: 600; text-align: right; }

    .rc-reset-btn {
      background: #ffe0ee; color: #8a0038; border: 2px solid #e88ab0; border-radius: 12px;
      padding: calc(14px * var(--s)) 36px; font-size: calc(15px * var(--s)); font-weight: 700; font-family: 'DM Sans', sans-serif;
      cursor: pointer; display: block; margin: 0 auto; letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s;
    }
    .rc-reset-btn:hover { background: #ffd0e8; }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Tablets: fill the screen and size everything up */
    @media (min-width: 700px) {
      :root { --s: 1.22; }
      .rc-header { padding-top: 22px; padding-bottom: 18px; }
      main.rc-body { max-width: none; padding: 16px 28px 18px; }
    }
    @media (min-width: 900px) and (min-height: 1300px) {
      :root { --s: 1.4; }
      main.rc-body { padding-left: 40px; padding-right: 40px; }
    }
    /* Tablet held sideways: keep it from getting too wide to read */
    @media (min-width: 700px) and (orientation: landscape) {
      :root { --s: 1.2; }
      main.rc-body { max-width: 1000px; }
      .rc-header { padding-top: 16px; padding-bottom: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#inp-name">Skip to form</a>

  <header class="rc-header">
    <p class="rc-header-eyebrow">P.S. I Crepe You</p>
    <h1 class="rc-header-title">Staff Alert</h1>
    <p class="rc-header-sub">Report an Issue</p>
  </header>

  <main class="rc-body" id="main">

    <form class="rc-card" id="form-card" novalidate onsubmit="handleSubmit(event)">

      <h2 class="rc-section-title first">Who's Reporting</h2>

      <label class="rc-label" for="inp-name">Your First Name</label>
      <input class="rc-input" type="text" id="inp-name" name="name" placeholder="First name"
             autocomplete="off" required aria-required="true" oninput="checkReady()" />

      <span class="rc-label" id="loc-label">Location</span>
      <div class="choice-grid three" role="group" aria-labelledby="loc-label">
        <button type="button" class="choice location-btn" aria-pressed="false" onclick="selectLocation('Riverside', this)">
          <span class="icon" aria-hidden="true">📍</span>
          <span class="text">Riverside</span>
        </button>
        <button type="button" class="choice location-btn" aria-pressed="false" onclick="selectLocation('Gallery at Tyler', this)">
          <span class="icon" aria-hidden="true">📍</span>
          <span class="text">Gallery at Tyler</span>
        </button>
        <button type="button" class="choice location-btn" aria-pressed="false" onclick="selectLocation('Rancho Cucamonga', this)">
          <span class="icon" aria-hidden="true">📍</span>
          <span class="text">Rancho</span>
        </button>
      </div>

      <h2 class="rc-section-title" id="type-label">Alert Type</h2>
      <div class="choice-grid" role="group" aria-labelledby="type-label">
        <button type="button" class="choice type-btn" aria-pressed="false" onclick="selectType('running-low', this)">
          <span class="icon" aria-hidden="true">📉</span>
          <span class="text">Running Low</span>
        </button>
        <button type="button" class="choice type-btn" aria-pressed="false" onclick="selectType('out-of-stock', this)">
          <span class="icon" aria-hidden="true">🚨</span>
          <span class="text">Completely Out</span>
        </button>
        <button type="button" class="choice type-btn" aria-pressed="false" onclick="selectType('broken', this)">
          <span class="icon" aria-hidden="true">🔧</span>
          <span class="text">Broken / Not Working</span>
        </button>
        <button type="button" class="choice type-btn" aria-pressed="false" onclick="selectType('other', this)">
          <span class="icon" aria-hidden="true">📝</span>
          <span class="text">Other / General Note</span>
        </button>
      </div>

      <h2 class="rc-section-title">Details</h2>

      <label class="rc-label" for="inp-item">Item / Equipment Name</label>
      <input class="rc-input" type="text" id="inp-item" name="item" placeholder="e.g. Nutella, waffle maker, cups..."
             autocomplete="off" required aria-required="true" oninput="checkReady()" />

      <label class="rc-label" for="inp-notes">Additional Notes <span class="opt">(optional)</span></label>
      <textarea class="rc-input" id="inp-notes" name="notes" placeholder="Any extra details for the manager..." rows="3"></textarea>

      <div class="submit-wrap">
        <button type="submit" class="rc-submit-btn" id="submit-btn" aria-disabled="true" aria-describedby="form-hint">
          Send Alert
        </button>
        <p class="form-hint" id="form-hint" aria-live="polite"></p>
      </div>
    </form>

    <section class="rc-card hidden" id="success-card" aria-labelledby="success-title" tabindex="-1">
      <div class="rc-success-icon" aria-hidden="true">✅</div>
      <h2 class="rc-success-title" id="success-title">Alert Sent!</h2>
      <p class="rc-success-sub">Management has been notified.<br/>Thank you for keeping us in the loop!</p>

      <div class="rc-alert-badge" id="badge"></div>

      <div class="rc-summary" id="summary-rows"></div>

      <button type="button" class="rc-reset-btn" onclick="handleReset()">Report Another Issue</button>
    </section>

  </main>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxIbDu3RR-MVqbezmpzph7gpXd6mAXt1UKOd6CLrD2Tk33QWXmga_xshmwn7otwIZvrow/exec"

    let selectedType = null
    let selectedLocation = null
    let sending = false

    const typeConfig = {
      'running-low':  { icon: '📉', label: 'Running Low',          bg: '#fff3cd', border: '#ffc107', color: '#6b4f00' },
      'out-of-stock': { icon: '🚨', label: 'Completely Out',        bg: '#fde8e8', border: '#f5a0a0', color: '#a12a1d' },
      'broken':       { icon: '🔧', label: 'Broken / Not Working',  bg: '#ffe8d4', border: '#ffb07a', color: '#8a4500' },
      'other':        { icon: '📝', label: 'General Note',          bg: '#e8f0ff', border: '#a0b8f5', color: '#1a3fa8' },
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
    }

    function press(groupSelector, el) {
      document.querySelectorAll(groupSelector).forEach(b => b.setAttribute('aria-pressed', 'false'))
      el.setAttribute('aria-pressed', 'true')
    }

    function selectLocation(loc, el) {
      press('.location-btn', el)
      selectedLocation = loc
      checkReady()
    }

    function selectType(type, el) {
      press('.type-btn', el)
      selectedType = type
      checkReady()
    }

    function missingFields() {
      const missing = []
      if (!document.getElementById('inp-name').value.trim()) missing.push('your first name')
      if (!selectedLocation) missing.push('a location')
      if (!selectedType) missing.push('an alert type')
      if (!document.getElementById('inp-item').value.trim()) missing.push('the item or equipment name')
      return missing
    }

    function checkReady() {
      const ready = missingFields().length === 0
      document.getElementById('submit-btn').setAttribute('aria-disabled', ready ? 'false' : 'true')
      if (ready) document.getElementById('form-hint').textContent = ''
    }

    async function handleSubmit(e) {
      e.preventDefault()
      if (sending) return

      const missing = missingFields()
      if (missing.length) {
        document.getElementById('form-hint').textContent = 'Please add ' + missing.join(', ') + '.'
        return
      }

      const name  = document.getElementById('inp-name').value.trim()
      const item  = document.getElementById('inp-item').value.trim()
      const notes = document.getElementById('inp-notes').value.trim()
      const timestamp = new Date().toLocaleString()
      const cfg = typeConfig[selectedType]

      const entry = { name, alertType: cfg.label, alertTypeKey: selectedType, item, notes, location: selectedLocation, timestamp }

      const btn = document.getElementById('submit-btn')
      sending = true
      btn.setAttribute('aria-disabled', 'true')
      btn.textContent = 'Sending...'

      try {
        await fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        })
      } catch(err) {}

      showSuccess(entry, cfg)
    }

    function showSuccess(entry, cfg) {
      document.getElementById('form-card').classList.add('hidden')
      const card = document.getElementById('success-card')
      card.classList.remove('hidden')

      const badge = document.getElementById('badge')
      badge.style.background = cfg.bg
      badge.style.borderColor = cfg.border
      badge.innerHTML = `
        <div class="badge-icon" aria-hidden="true">${cfg.icon}</div>
        <div class="badge-type" style="color:${cfg.color}">${esc(cfg.label)}</div>
        <div class="badge-item" style="color:${cfg.color}">${esc(entry.item)}</div>
      `

      const rows = [['Reported by', entry.name], ['Location', entry.location], ['Time', entry.timestamp]]
      if (entry.notes) rows.push(['Notes', entry.notes])

      document.getElementById('summary-rows').innerHTML = rows.map(([k, v]) =>
        `<div class="rc-summary-row"><span class="rc-summary-key">${esc(k)}</span><span class="rc-summary-val">${esc(v)}</span></div>`
      ).join('')

      card.focus()
    }

    function handleReset() {
      document.getElementById('success-card').classList.add('hidden')
      document.getElementById('form-card').classList.remove('hidden')
      document.getElementById('inp-name').value = ''
      document.getElementById('inp-item').value = ''
      document.getElementById('inp-notes').value = ''
      document.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', 'false'))
      selectedType = null
      selectedLocation = null
      sending = false
      const btn = document.getElementById('submit-btn')
      btn.textContent = 'Send Alert'
      document.getElementById('form-hint').textContent = ''
      checkReady()
      document.getElementById('inp-name').focus()
    }
  </script>

</body>
</html>
